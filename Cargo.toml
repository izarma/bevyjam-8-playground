[package]
name = "bevy_game" # ToDo
version = "0.1.0"
publish = false
authors = ["izarma"] # ToDo
edition = "2024"
exclude = ["dist", "build", "assets", "credits"]

[workspace]
members = ["mobile"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# `trunk build --release`
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# `trunk build --cargo-profile web`.
[profile.web]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
]

# Bevy's default features are `2d`, `3d`, `ui` and `audio`. We take all of them except for `audio`, since it clashes with bevy_kira_audio.
# If your game doesn't need 3d (or 2d), dropping that collection here will cut down on compile times.
[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "2d",
    "3d",
    "ui",
    "debug",
    "bevy_ui_debug",
] }
bevy_kira_audio = { version = "0.27" }
bevy_asset_loader = { version = "0.28.0" }
rand = { version = "0.10.3" }
webbrowser = { version = "1", features = ["hardened"] }

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
bevy_sprite3d = "10.1.0"
# bevy-inspector-egui = "0.38.0"
bevy_enhanced_input = "0.27"
jackdaw_runtime = { version = "0.20", default-features = false, features = ["terrain"] }
avian3d = { version = "0.8", features = ["3d", "parry-f32", "collider-from-mesh"] }
jackdaw_avian_integration = "0.20"
bevy_ahoy = { git = "https://github.com/Piefayth/bevy_ahoy" }

[patch.crates-io]
jackdaw_avian_integration = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_bind = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_bsn = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_camera_rig = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_geometry = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_pie_protocol = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_prefab = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_runtime = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_scene_types = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_schema = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_surface = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_terrain = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }
jackdaw_widgets_runtime = { git = "https://github.com/Piefayth/jackdaw", branch = "pixel-terrain-0.20.0" }

# PIE, certain asset importing, and PCSS doesnt work in browsers
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jackdaw_runtime = { version = "0.20", features = ["pie", "import", "soft_shadows"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TAA and SSAO need webgpu
bevy = { version = "0.20", default-features = false, features = ["webgpu"] }
# Required to make `rand`/`getrandom` work on wasm.
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
embed-resource = "1"
